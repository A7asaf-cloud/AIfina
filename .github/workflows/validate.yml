name: Validate production readiness

on:
  pull_request:
  push:
    branches: [main, master, feat/mobile-store-readiness]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aifina
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: aifina_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aifina -d aifina_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://aifina:test_only_password@localhost:5432/aifina_test
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npm run mobile:sync
  android-debug:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - run: npm run mobile:sync
      - run: bash ./gradlew assembleDebug
        working-directory: android
